services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soportehub
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  flyway:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/soportehub
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/flyway/flyway.conf:/flyway/conf/flyway.conf:ro
      - ./src/main/resources/db/migration:/flyway/sql:ro
    command: migrate
    restart: "no"