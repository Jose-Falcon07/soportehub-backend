
name: soportehub-dev

services:

  soportehub:
    build:
      context: .
      dockerfile: Dockerfile


    container_name: soportehub_api_dev

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8081:8081"

    environment:
     # SPRING_PROFILES_ACTIVE: dev
      # El .env trae PORT=8081; se fija aquí también para que el HEALTHCHECK
      # del Dockerfile sondee el mismo puerto publicado arriba.
      PORT: 8081

      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

      FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      # jdbc:postgresql://postgres:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - soportehub

  postgres:
    image: postgres:16-alpine
    container_name: soportehub_db_dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soportehub_db}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      # Con `${POSTGRES_PASSWORD}` sin default y la variable ausente del .env,
      # Postgres abortaba el arranque: "Database is uninitialized and superuser
      # password is not specified".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soportehub123}

    # 5433 en el host: prod publica el 5432 y ambos stacks deben poder correr a
    # la vez. Dentro de la red de Compose el backend sigue hablando al 5432.
    ports:
      - "5433:5432"

    volumes:
      - soportehub_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-soportehub_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - soportehub

  redis:
    image: redis:7-alpine
    container_name: soportehub_redis_dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - soportehub_redis_data:/data

    # Antes era `condition: service_started`: la app arrancaba contra un Redis
    # que aún no aceptaba conexiones.
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - soportehub

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: soportehub_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@soportehub.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - soportehub

volumes:
  soportehub_postgres_data:
  soportehub_redis_data:


networks:
  soportehub: