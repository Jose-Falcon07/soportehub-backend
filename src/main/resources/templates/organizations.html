<form th:action="@{/organizations}" method="post">

    <!-- Se tiene que declarar explicitamente el token de CSRF -->
     
    <label th:text="#{org.name}"></label>
    <input type="text" name="name" required>

    <label th:text="#{org.adminName}"></label>
    <input type="text" name="adminName" required>

    <label th:text="#{org.adminEmail}"></label>
    <input type="email" name="adminEmail" required>

    <p>
        <button type="submit" th:text="#{org.create}"></button>
    </p>

</form>
